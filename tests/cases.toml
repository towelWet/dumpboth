# cases.toml — one synthetic session per agent and what its readable dump must and must not hold.
# NEVER DELETE COMMENTS — explain every non-obvious line.
# Why data: new agent = new case and fixture, no test code edit.
[[case]]
agent = "claude"
session = ".claude/projects/demo/aaaaaaaa-1111-2222-3333-444444444444.jsonl"
fixture = "claude.jsonl"
expect = ["Opus 5.5 · Claude Code", "❯ Add a done flag", "⏺ Added done flag. Tests pass.", "HISTORICAL RECORD"]
reject = ["injected context", "internal meta line", "half written"]

[[case]]
agent = "codex"
session = ".codex/sessions/2026/01/01/rollout-2026-01-01T00-00-00-aaaaaaaa-1111-2222-3333-444444444444.jsonl"
fixture = "codex.jsonl"
expect = ["Resume: codex resume aaaaaaaa-1111-2222-3333-444444444444", "Codex CLI", "❯ Add a done flag", "⏺ Added done flag.\nTests pass."]
reject = ["injected context", "token_count"]

[[case]]
agent = "gemini"
session = ".gemini/tmp/demo/session-demo.jsonl"
fixture = "gemini.jsonl"
expect = ["demo-gemini-model", "❯ Add a done flag", "⏺ Added done flag.\n\nTests pass.", "Resume: gemini"]
reject = ["status"]

[[case]]
agent = "cursor"
session = ".cursor/projects/demo/agent-transcripts/demo-id/demo-id.jsonl"
fixture = "cursor.jsonl"
expect = ["Cursor IDE", "❯ Add a done flag", "Tool: Shell\nnpm test"]
reject = ["injected", "user_query"]
